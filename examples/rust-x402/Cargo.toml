[package]
name = "rust-x402"
version = "0.1.0"
edition = "2018"
description = "x402 v2 Stellar/Soroban payment client — end-to-end testnet example"

[[bin]]
name = "rust-x402"
path = "src/main.rs"

[dependencies]
# Official Stellar crates for XDR types, strkey parsing and Soroban RPC
# (issue #40: no hand-rolled XDR).
stellar-xdr = { version = "27", default-features = false, features = ["std", "serde", "base64"] }
stellar-strkey = "0.0.18"
stellar-rpc-client = "27.0.0"
ed25519-dalek = "3"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
async-trait = "0.1"
url = "2"

[dev-dependencies]
wiremock = "0.6"
